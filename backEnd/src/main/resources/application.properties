# ─────────────────────────────────────────────────────────────────────────────
# Supabase PostgreSQL DataSource
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0&tcpKeepAlive=true
spring.datasource.username=postgres.zubirjxjmjvmpyezmyzg
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.initialization-fail-timeout=0

# ─────────────────────────────────────────────────────────────────────────────
# JPA / Hibernate — PostgreSQL dialect
# ─────────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────────────────────────────────────
# Supabase Auth (REST API)
# ─────────────────────────────────────────────────────────────────────────────
supabase.url=https://zubirjxjmjvmpyezmyzg.supabase.co
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}

# ─────────────────────────────────────────────────────────────────────────────
# JWT
# ─────────────────────────────────────────────────────────────────────────────
sandboxpro.jwtExpirationMs=86400000
sandboxpro.jwtSecret=HarvestLinkSecretKey2024SupabasePostgresJWTSigningKeyForFoodRedistributionPlatform

# ─────────────────────────────────────────────────────────────────────────────
# Jackson — LocalDateTime as ISO strings, not arrays
# ─────────────────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=WARN
logging.level.com.myanatomy=INFO
logging.level.com.myanatomy.sandboxpro.config=DEBUG

# Multipart file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

